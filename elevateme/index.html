<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevateMe · Career Bootcamp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="shared/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8faf9; margin: 0; }
        .hero { background: #161616; padding: 4rem 2rem 3rem; text-align: left; }
        .hero-inner { max-width: 1200px; margin: 0 auto; }
        .hero-tag { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(97,154,132,0.15); border: 1px solid rgba(97,154,132,0.3); color: #a8cbbf; padding: 0.3rem 1rem; border-radius: 100px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 1.4rem; }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.8rem); color: white; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
        .hero h1 span { color: var(--brand-teal); }
        .hero p { color: rgba(255,255,255,0.5); font-size: 1rem; max-width: 480px; line-height: 1.7; margin-bottom: 2.5rem; }
        .section { max-width: 1200px; margin: 3rem auto; padding: 0 2rem; }
        .section-title { font-size: 1.6rem; font-weight: 800; color: #161616; margin-bottom: 2rem; }
        .overall-progress-wrap { background: white; border-radius: 14px; padding: 1.2rem 1.6rem; margin-bottom: 2rem; border: 1px solid #edf2f0; }
        .overall-progress-label { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.6rem; }
        .progress-track { height: 8px; background: #edf2f0; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--brand-teal); transition: width 0.6s ease; }
        .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .week-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #edf2f0; text-decoration: none; color: inherit; display: block; transition: all 0.3s ease; position: relative; }
        .week-card:hover:not(.locked) { transform: translateY(-5px); border-color: var(--brand-teal); box-shadow: 0 12px 24px rgba(97,154,132,0.1); }
        .week-card.locked { opacity: 0.55; cursor: not-allowed; }
        .week-card.completed { border-left: 4px solid var(--brand-teal); }
        .card-body { padding: 1.8rem; }
        .week-num-label { color: var(--brand-teal); text-transform: uppercase; font-weight: 700; font-size: 0.72rem; margin-bottom: 0.6rem; display: block; }
        .card-progress-bar { height: 5px; background: #edf2f0; border-radius: 99px; overflow: hidden; margin-top: 1rem; }
        .card-progress-fill { height: 100%; background: var(--brand-teal); transition: width 0.4s ease; }
        .lock-badge, .done-badge { position: absolute; top: 1rem; right: 1rem; border-radius: 50%; width: 26px; height: 26px; display: none; align-items: center; justify-content: center; color: white; font-size: 0.7rem; }
        .lock-badge { background: #b2bec3; display: flex; }
        .done-badge { background: var(--brand-teal); }
        .week-card.locked .lock-badge { display: flex; }
        .week-card:not(.locked) .lock-badge { display: none; }
        .week-card.completed .done-badge { display: flex; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .logout-btn { background: none; border: 1px solid #c8ecd4; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; color: var(--brand-accent); }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="logo-area" href="/">
        <span style="font-size:1.3rem;font-weight:900;color:#161616;">Elevate<span style="color:var(--brand-teal);">Me</span></span>
    </a>
    <div class="nav-links" id="navLinks">
        <span class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Mode</span>
        <div class="user-info" id="userInfo" style="display: none;">
            <span id="userEmail" style="font-size: 0.8rem;"></span>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>
</nav>

<div class="hero">
    <div class="hero-inner">
        <div class="hero-tag"><i class="fas fa-bolt"></i> 10-Week Bootcamp</div>
        <h1>Elevate Your <span>Career</span></h1>
        <p>Master the US job market with our structured curriculum.</p>
    </div>
</div>

<div class="section">
    <div class="overall-progress-wrap">
        <div class="overall-progress-label">
            <span>Bootcamp Progress</span>
            <span id="overallPct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="overallBar"></div></div>
    </div>

    <div class="section-title">Your 10-Week Journey</div>
    <div class="week-grid" id="weekGrid"></div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

<script src="shared/supabase.js"></script>
<script>
const WEEKS = [
    { n:1, title:'Foundations & Job Search', modules:5, url:'week1/' },
    { n:2, title:'ATS & Resume Mastery', modules:10, url:'week2/' },
    { n:3, title:'Pitch & Mock Interviews', modules:4, url:'week3/' },
    { n:4, title:'Communication Skills', modules:4, url:'week4/' },
    { n:5, title:'Advanced Interviews', modules:3, url:'week5/' },
    { n:6, title:'Networking on LinkedIn', modules:5, url:'week6/' },
    { n:7, title:'Informational Interviews', modules:6, url:'week7/' },
    { n:8, title:'Handling Job Offers', modules:4, url:'week8/' },
    { n:9, title:'Cultural Sensitivity', modules:3, url:'week9/' },
    { n:10, title:'Success on the Job', modules:3, url:'week10/' }
];

let cloudProgress = {};

async function initDashboard() {
    const auth = await requireAuth();
    if (!auth) return;

    document.getElementById('userEmail').textContent = auth.user.email;
    document.getElementById('userInfo').style.display = 'flex';
    if(auth.profile.role === 'admin' || auth.profile.role === 'coach') {
        document.body.classList.add('is-admin');
    }

    const client = await initSupabase();
    const { data } = await client
        .from('week_progress')
        .select('week_num, progress_percent')
        .eq('user_id', auth.user.id);

    data?.forEach(w => cloudProgress[w.week_num] = w.progress_percent);
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = '';
    let total = 0;

    WEEKS.forEach((w, i) => {
        const pct = cloudProgress[w.n] || 0;
        const prevDone = i === 0 || (cloudProgress[WEEKS[i-1].n] >= 100);
        const locked = !prevDone;
        
        const card = document.createElement('a');
        card.href = locked ? '#' : w.url;
        card.className = `week-card ${locked ? 'locked' : ''} ${pct >= 100 ? 'completed' : ''}`;
        card.innerHTML = `
            <div class="lock-badge"><i class="fas fa-lock"></i></div>
            <div class="done-badge"><i class="fas fa-check"></i></div>
            <div class="card-body">
                <span class="week-num-label">Week ${w.n}</span>
                <h3>${w.title}</h3>
                <div class="card-progress-bar"><div class="card-progress-fill" style="width:${pct}%"></div></div>
            </div>
        `;
        
        if (locked) {
            card.onclick = (e) => {
                e.preventDefault();
                showToast(`Complete Week ${w.n-1} first!`);
            };
        }
        grid.appendChild(card);
        total += pct;
    });

    const overall = Math.round(total / WEEKS.length);
    document.getElementById('overallBar').style.width = overall + '%';
    document.getElementById('overallPct').textContent = overall + '%';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

initDashboard();
</script>
</body>
</html>
