<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard · ElevateMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #e8f5ee;
        }
        
        /* Navbar */
        .navbar {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #c8ecd4;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h2 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #0a1a0f;
        }
        .logo h2 span { color: #2d7a4f; }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            text-decoration: none;
            color: #2d4a35;
            font-weight: 600;
        }
        .nav-links a:hover { color: #2d7a4f; }
        .admin-badge {
            background: #2d7a4f;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .btn-logout {
            background: none;
            border: 1px solid #c8ecd4;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #c65343;
        }
        
        /* Main */
        .main-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #c8ecd4;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            color: #2d7a4f;
        }
        .stat-label {
            color: #4a6b55;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.3rem;
        }
        
        /* Actions */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .btn-primary {
            background: #2d7a4f;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary:hover { background: #1f5c38; }
        .search-box {
            padding: 0.7rem 1rem;
            border: 1px solid #c8ecd4;
            border-radius: 10px;
            width: 250px;
        }
        
        /* Table */
        .students-table {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #c8ecd4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e8f5ee;
        }
        th {
            background: #f4faf7;
            font-weight: 800;
            color: #2d4a35;
        }
        tr:hover { background: #f9fefb; }
        .progress-bar-container {
            width: 100px;
            height: 6px;
            background: #c8ecd4;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2d7a4f;
            border-radius: 3px;
        }
        .btn-view {
            background: none;
            border: 1px solid #2d7a4f;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            color: #2d7a4f;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-view:hover {
            background: #2d7a4f;
            color: white;
        }
        .role-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .role-student { background: #e8f5ee; color: #2d7a4f; }
        .role-coach { background: #fff3e0; color: #d97706; }
        .role-admin { background: #fee2e2; color: #c65343; }
        
        @media(max-width: 768px) {
            .main-container { padding: 0 1rem; }
            th, td { padding: 0.75rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h2>Elevate<span>Me</span></h2>
        </div>
        <div class="nav-links">
            <span class="admin-badge"><i class="fas fa-shield-alt"></i> Admin</span>
            <a href="/admin/">Dashboard</a>
            <a href="/admin/create-student.html">Add Student</a>
            <button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>
    
    <div class="main-container">
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeStudents">0</div>
                <div class="stat-label">Active (last 7 days)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgProgress">0%</div>
                <div class="stat-label">Average Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed Bootcamp</div>
            </div>
        </div>
        
        <div class="actions-bar">
            <a href="/admin/create-student.html" class="btn-primary">
                <i class="fas fa-user-plus"></i> Add New Student
            </a>
            <input type="text" class="search-box" placeholder="Search students..." id="searchInput">
        </div>
        
        <div class="students-table">
            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Progress</th>
                        <th>Weeks Done</th>
                        <th>Last Active</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <tr><td colspan="7" style="text-align:center;">Loading students...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="../shared/supabase.js"></script>
    <script>
        const SUPABASE_URL = 'https://jlfbmawoyiwzvzklngxr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZmJtYXdveWl3enZ6a2xuZ3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDI0OTMsImV4cCI6MjA4OTUxODQ5M30.JuMbxTyAhujTB4RqPiKbn5d4pxqK67EO_CTBj1xwt9o';
        
        let supabaseClient = null;
        let allStudents = [];
        
        async function initSupabaseLocal() {
            if (!supabaseClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }
        
        async function checkAuth() {
            const client = await initSupabaseLocal();
            const { data: { user } } = await client.auth.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return null;
            }
            
            const { data: profile } = await client
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();
            
            if (profile?.role !== 'admin' && profile?.role !== 'coach') {
                window.location.href = '/';
                return null;
            }
            
            return { user, profile };
        }
        
        async function loadStudents() {
            const client = await initSupabaseLocal();
            
            const { data: profiles, error } = await client
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading students:', error);
                return [];
            }
            
            // Get week progress for each student
            const studentsWithProgress = await Promise.all(profiles.map(async (student) => {
                const { data: weekData } = await client
                    .from('week_progress')
                    .select('week_num, progress_percent')
                    .eq('user_id', student.id);
                
                const totalProgress = weekData?.reduce((sum, w) => sum + w.progress_percent, 0) / 10 || 0;
                const weeksCompleted = weekData?.filter(w => w.progress_percent === 100).length || 0;
                
                return {
                    ...student,
                    total_progress: Math.round(totalProgress),
                    weeks_completed: weeksCompleted
                };
            }));
            
            return studentsWithProgress;
        }
        
        function renderStudents(students) {
            const tbody = document.getElementById('studentsTableBody');
            
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No students found</td></tr>';
                return;
            }
            
            tbody.innerHTML = students.map(student => `
                <tr>
                    <td><strong>${escapeHtml(student.full_name || '—')}</strong></td>
                    <td>${escapeHtml(student.email)}</td>
                    <td>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div class="progress-bar-container">
                                <div class="progress-fill" style="width: ${student.total_progress}%"></div>
                            </div>
                            <span style="font-size:0.75rem;">${student.total_progress}%</span>
                        </div>
                    </td>
                    <td>${student.weeks_completed}/10</td>
                    <td>${formatDate(student.last_active)}</td>
                    <td>
                        <span class="role-badge role-${student.role}">
                            ${student.role === 'admin' ? 'Admin' : student.role === 'coach' ? 'Coach' : 'Student'}
                        </span>
                    </td>
                    <td>
                        <a href="/admin/student-view.html?student=${student.id}" class="btn-view">
                            <i class="fas fa-eye"></i> View
                        </a>
                    </td>
                </tr>
            `).join('');
        }
        
        function updateStats(students) {
            const total = students.filter(s => s.role === 'student').length;
            const active = students.filter(s => {
                if (s.role !== 'student') return false;
                const lastActive = new Date(s.last_active);
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                return lastActive > sevenDaysAgo;
            }).length;
            const avgProgress = students.filter(s => s.role === 'student').reduce((sum, s) => sum + s.total_progress, 0) / total || 0;
            const completed = students.filter(s => s.role === 'student' && s.total_progress === 100).length;
            
            document.getElementById('totalStudents').textContent = total;
            document.getElementById('activeStudents').textContent = active;
            document.getElementById('avgProgress').textContent = Math.round(avgProgress) + '%';
            document.getElementById('completedCount').textContent = completed;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'Never';
            const date = new Date(dateStr);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            return date.toLocaleDateString();
        }
        
        async function handleLogout() {
            const client = await initSupabaseLocal();
            await client.auth.signOut();
            window.location.href = '/login.html';
        }
        
        // Search filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.email.toLowerCase().includes(searchTerm) ||
                (s.full_name && s.full_name.toLowerCase().includes(searchTerm))
            );
            renderStudents(filtered);
        });
        
        // Initialize
        (async () => {
            const auth = await checkAuth();
            if (!auth) return;
            
            const students = await loadStudents();
            allStudents = students;
            renderStudents(students);
            updateStats(students);
        })();
    </script>
</body>
</html>
