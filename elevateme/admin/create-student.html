<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student · ElevateMe Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito Sans', sans-serif; background: #e8f5ee; }
        .navbar { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #c8ecd4; }
        .logo h2 { font-size: 1.5rem; font-weight: 900; color: #0a1a0f; }
        .logo h2 span { color: var(--brand-teal); }
        .main-container { max-width: 600px; margin: 3rem auto; padding: 0 2rem; }
        .form-card { background: white; border-radius: 24px; padding: 2.5rem; border: 1px solid #c8ecd4; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-title { font-size: 1.5rem; font-weight: 800; color: #0a1a0f; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #2d4a35; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.9rem 1rem; border: 1px solid #c8ecd4; border-radius: 12px; font-size: 0.95rem; }
        .btn-create { width: 100%; background: #2d7a4f; color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 0.9rem; font-weight: 800; cursor: pointer; margin-top: 1rem; }
        .success-message { background: #d4edda; color: #155724; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; display: none; font-size: 0.85rem; }
        .error-message { background: #fee2e2; color: #c65343; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; display: none; font-size: 0.85rem; }
        .show { display: block; }
        .generated-password { background: #f4faf7; padding: 1rem; border-radius: 12px; border: 1px dashed #2d7a4f; margin: 1rem 0; display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><h2>Elevate<span>Me</span></h2></div>
        <div class="nav-links">
            <a href="/admin/">Dashboard</a>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </nav>
    
    <div class="main-container">
        <div class="form-card">
            <h1 class="form-title"><i class="fas fa-user-plus"></i> Add New Student</h1>
            
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> Account invitation triggered!
            </div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="generated-password" id="passwordDisplay">
                <p style="font-size:0.8rem; font-weight:700; color:#2d7a4f; margin-bottom:5px;">TEMPORARY PASSWORD:</p>
                <code id="tempPassCode" style="font-size:1.2rem; letter-spacing:2px; font-weight:900;"></code>
                <p style="font-size:0.75rem; color:#666; margin-top:10px;">Give this to the student. They must change it at login.</p>
            </div>
            
            <form id="createStudentForm">
                <div class="form-group">
                    <label>Student Full Name</label>
                    <input type="text" id="fullName" required placeholder="Ex: Jhanvi Sharma">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="student@email.com">
                </div>
                <button type="submit" class="btn-create" id="submitBtn">Create Student Account</button>
            </form>
            
            <a href="/admin/" style="display:block; text-align:center; margin-top:1.5rem; font-size:0.85rem; color:#666; text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Cancel and go back
            </a>
        </div>
    </div>
    
    <script src="../shared/supabase.js"></script>
    <script>
        // Start Auth Check
        (async () => {
            const auth = await requireAuth();
            if (!auth || auth.profile.role !== 'admin') {
                window.location.href = '/';
            }
        })();

        function generatePass() {
            return Math.random().toString(36).slice(-8) + "!";
        }

        document.getElementById('createStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMessage');
            const succ = document.getElementById('successMessage');
            const passBox = document.getElementById('passwordDisplay');
            
            const email = document.getElementById('email').value;
            const name = document.getElementById('fullName').value;
            const tempPass = generatePass();

            btn.disabled = true;
            btn.textContent = "Processing...";
            err.classList.remove('show');

            const client = await initSupabase();

            /* IMPORTANT: In the browser, we use signUp. 
               This will send a confirmation email to the student.
            */
            const { data, error } = await client.auth.signUp({
                email: email,
                password: tempPass,
                options: {
                    data: { full_name: name, role: 'student' }
                }
            });

            if (error) {
                err.textContent = "Error: " + error.message;
                err.classList.add('show');
                btn.disabled = false;
                btn.textContent = "Create Student Account";
            } else {
                // Success: Show the password so the admin can copy it
                document.getElementById('tempPassCode').textContent = tempPass;
                passBox.style.display = 'block';
                succ.classList.add('show');
                btn.textContent = "Student Created";
                
                // Also manually create the profile row if trigger fails
                await client.from('profiles').insert([
                    { id: data.user.id, email: email, full_name: name, role: 'student' }
                ]);
            }
        });
    </script>
</body>
</html>
