<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · ElevateMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito Sans', sans-serif;
            background: linear-gradient(135deg, #e8f5ee 0%, #c8ecd4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .reset-container { max-width: 440px; width: 100%; }
        .reset-card {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 2rem; font-weight: 900; color: #0a1a0f; }
        .logo h1 span { color: #2d7a4f; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #2d4a35;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #c8ecd4;
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2d7a4f;
        }
        .btn-reset {
            width: 100%;
            background: #2d7a4f;
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }
        .btn-reset:hover { background: #1f5c38; }
        .error-message {
            background: #fee2e2;
            color: #c65343;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        .error-message.show, .success-message.show { display: block; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #2d7a4f;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card" id="resetCard">
            <div class="logo">
                <h1>Elevate<span>Me</span></h1>
                <p>Set a new password</p>
            </div>
            
            <div id="loadingState" class="loading">
                <i class="fas fa-spinner fa-spin"></i> Verifying reset link...
            </div>
            
            <div id="formContainer" style="display: none;">
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i> Password updated! Redirecting to login...
                </div>
                
                <form id="resetForm">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-reset" id="resetBtn">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        const SUPABASE_URL = 'https://jlfbmawoyiwzvzklngxr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZmJtYXdveWl3enZ6a2xuZ3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDI0OTMsImV4cCI6MjA4OTUxODQ5M30.JuMbxTyAhujTB4RqPiKbn5d4pxqK67EO_CTBj1xwt9o';
        
        let supabaseClient = null;
        let sessionSet = false;
        
        async function initSupabase() {
            if (!supabaseClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
            return supabaseClient;
        }
        
        // Handle the password reset from URL (works with both ? and #)
        async function handleReset() {
            const client = await initSupabase();
            
            // Check both query params (?) and hash (#)
            const queryParams = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // Try to get token from query params first (if using ?)
            let accessToken = queryParams.get('access_token');
            let refreshToken = queryParams.get('refresh_token');
            let type = queryParams.get('type');
            
            // If not found in query, try hash
            if (!accessToken) {
                accessToken = hashParams.get('access_token');
                refreshToken = hashParams.get('refresh_token');
                type = hashParams.get('type');
            }
            
            console.log('Token found:', !!accessToken);
            console.log('Type:', type);
            
            if (!accessToken) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'No reset link detected. Please request a password reset from the login page.';
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            if (type !== 'recovery') {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'This link is not for password recovery. Please request a new reset link.';
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            // Set the session with the recovery token
            const { data, error } = await client.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken || ''
            });
            
            if (error) {
                console.error('Session error:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('formContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').classList.add('show');
                document.getElementById('resetBtn').disabled = true;
                return;
            }
            
            console.log('Session set successfully');
            sessionSet = true;
            
            // Hide loading, show form
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('formContainer').style.display = 'block';
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!sessionSet) {
                document.getElementById('errorMessage').textContent = 'Please wait, verifying reset link...';
                document.getElementById('errorMessage').classList.add('show');
                return;
            }
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('resetBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }
            
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.classList.add('show');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Updating...';
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            const client = await initSupabase();
            const { error } = await client.auth.updateUser({
                password: password
            });
            
            if (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = 'Update Password';
                return;
            }
            
            // Success - show message and redirect
            successDiv.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = 'Update Password';
            
            setTimeout(() => {
                window.location.href = '/login.html?reset=success';
            }, 2000);
        });
        
        // Run when page loads
        handleReset();
    </script>
</body>
</html>
