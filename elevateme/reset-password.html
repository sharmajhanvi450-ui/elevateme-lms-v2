<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · ElevateMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito Sans', sans-serif; background: #e8f5ee; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .reset-card { background: white; border-radius: 24px; padding: 2.5rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); max-width: 400px; width: 100%; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 2rem; font-weight: 900; color: #0a1a0f; }
        .logo h1 span { color: #2d7a4f; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #2d4a35; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.9rem 1rem; border: 1px solid #c8ecd4; border-radius: 12px; font-size: 0.95rem; }
        .btn-reset { width: 100%; background: #2d7a4f; color: white; border: none; padding: 0.9rem; border-radius: 12px; font-size: 0.9rem; font-weight: 800; cursor: pointer; }
        .error-message { background: #fee2e2; color: #c65343; padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1rem; display: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">
            <h1>Elevate<span>Me</span></h1>
            <p style="font-size: 0.9rem; color: #666;">Create your permanent password</p>
        </div>
        
        <div class="error-message" id="errorMsg"></div>
        
        <form id="newPasswordForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="pass1" required placeholder="••••••••" minlength="6">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="pass2" required placeholder="••••••••" minlength="6">
            </div>
            <button type="submit" class="btn-reset" id="submitBtn">Update Password</button>
        </form>
    </div>

    <script src="shared/supabase.js"></script>
    <script>
        document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('pass1').value;
            const p2 = document.getElementById('pass2').value;
            const err = document.getElementById('errorMsg');
            const btn = document.getElementById('submitBtn');

            if (p1 !== p2) {
                err.textContent = "Passwords do not match!";
                err.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Updating...";

            const client = await initSupabase();
            const { error } = await client.auth.updateUser({ password: p1 });

            if (error) {
                err.textContent = error.message;
                err.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Update Password";
            } else {
                alert("Password updated successfully! Please login.");
                window.location.href = "/login.html";
            }
        });
    </script>
</body>
</html>
