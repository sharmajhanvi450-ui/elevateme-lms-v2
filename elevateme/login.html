<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · ElevateMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito Sans', sans-serif;
            background: #e8f5ee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid #c8ecd4;
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 2rem; font-weight: 900; color: #0a1a0f; }
        .logo h1 span { color: #2d7a4f; }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #2d4a35;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #c8ecd4;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #2d7a4f; }
        
        .btn-login {
            width: 100%;
            background: #2d7a4f;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #1f5c38; }
        .btn-login:disabled { background: #a8cbbf; cursor: not-allowed; }

        .error-message {
            background: #fee2e2;
            color: #c65343;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            display: none;
            border: 1px solid #fecaca;
        }
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .footer-links a { color: #2d7a4f; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">
            <h1>Elevate<span>Me</span></h1>
            <p style="color: #666; font-size: 0.9rem; margin-top: 5px;">Student Portal</p>
        </div>

        <div id="errorMsg" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="footer-links">
            <a href="forgot-password.html">Forgot password?</a>
        </div>
    </div>

    <script src="shared/supabase.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            // UI State: Loading
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            errorMsg.style.display = 'none';

            try {
                // 1. Initialize Supabase Client from shared/supabase.js
                const client = await initSupabase();
                
                // 2. Attempt Login
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // 3. requireAuth() in shared/supabase.js handles 
                // fetching the user profile and redirecting to / or /admin/
                await requireAuth();

            } catch (err) {
                // Handle Errors
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Redirect if already logged in
        (async () => {
            const client = await initSupabase();
            const { data: { user } } = await client.auth.getUser();
            if (user) {
                await requireAuth(); // This will auto-redirect based on role
            }
        })();
    </script>
</body>
</html>
