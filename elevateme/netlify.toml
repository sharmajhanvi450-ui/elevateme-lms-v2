# SPA redirects - preserve query parameters for auth
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Auth pages - don't redirect to index
[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset.html"
  to = "/reset.html"
  status = 200
  force = false

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = false

